name: Carga Automática de Dados

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# Força o runner do GitHub a usar o Node 24 por padrão nas ações
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  atualizar-datalake:
    runs-on: ubuntu-latest

    steps:
      # Atualizado de @v4 para @v5 (Suporte nativo a Node 24)
      - name: Checkout do código
        uses: actions/checkout@v5

      # Atualizado de @v5 para @v6 (Suporte nativo a Node 24)
      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar o Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar Dependências
        run: poetry install --no-root

      - name: Executar Pipeline de Carga e Auditoria
        env:
          CGU_API_BASE_URL: ${{ secrets.CGU_API_BASE_URL }}
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_BUCKET_NAME: ${{ secrets.CLOUDFLARE_BUCKET_NAME }}
          LOCAL_DATA_DIR: "data"
        run: |
          poetry run python -m src.main